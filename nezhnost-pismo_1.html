<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ede2">
<title>Доставка нежности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ede2; --ink:#3f342e; --soft:#8a7a6e; --line:#e3d8c8; --accent:#9a5b4c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background-color:var(--paper);
  /* едва заметные линейки и зерно бумаги */
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 35px, rgba(160,130,100,.11) 35px 36px),
    radial-gradient(rgba(120,90,60,.05) 1px, transparent 1px);
  background-size:auto, 4px 4px;
  font-family:"Cormorant Garamond", Georgia, serif;
}
main{min-height:100svh;display:flex;justify-content:center;padding:clamp(28px,8vh,80px) 22px 40px}
.letter{width:min(100%,520px);position:relative}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.eyebrow{margin:8px 0 0;font-style:italic;font-size:1.05rem;color:var(--soft)}
.scene{position:relative;width:150px;flex:none;margin-right:-10px}
.hedgehog{width:100%;height:auto;overflow:visible;transform:rotate(4deg)}

h1{font-weight:500;font-size:clamp(2.2rem,8vw,3rem);line-height:1.05;letter-spacing:-.01em;margin:10px 0 22px}
.message{font-family:"Caveat",cursive;font-size:clamp(1.6rem,6vw,1.95rem);line-height:1.3;margin:0 0 20px;color:#2f2722}
.caption{font-style:italic;font-size:1.15rem;line-height:1.55;color:var(--soft);margin:0 0 36px;max-width:440px}

.actions{display:flex;justify-content:flex-end}
.link{
  background:none;border:0;padding:4px 0;cursor:pointer;color:var(--accent);
  font-family:"Caveat",cursive;font-size:1.65rem;
  border-bottom:1px solid currentColor;transition:opacity .2s;
}
.link:hover{opacity:.7}
.note{margin:48px 0 0;font-style:italic;font-size:1rem;color:var(--soft)}
.note::before{content:"P.S. ";font-style:normal}

/* ёжик */
.hog-body{transform-box:view-box;transform-origin:150px 290px;animation:bob 3s ease-in-out infinite}
.hog-arm{transform-box:view-box;transform-origin:192px 226px}
.scene.cheering .hog-arm{animation:armWave 1.1s ease-in-out infinite}
.scene.kissing .hog-body{animation:kiss .6s ease-in-out 2}
.heart{position:absolute;color:var(--accent);font-size:18px;opacity:0;pointer-events:none}
.heart.one{left:0;top:20px}.heart.two{right:4px;top:6px}.heart.three{right:20%;top:60px}
.scene.kissing .heart{animation:floatHeart 1.6s ease-out forwards}
.scene.kissing .heart.two{animation-delay:.25s}.scene.kissing .heart.three{animation-delay:.5s}

.in{animation:appear .6s ease both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes armWave{0%,100%{transform:rotate(0)}40%{transform:rotate(-55deg)}60%{transform:rotate(-35deg)}80%{transform:rotate(-62deg)}}
@keyframes kiss{0%,100%{transform:rotate(0)}35%{transform:translateX(6px) rotate(4deg)}65%{transform:translateX(-2px) rotate(-2deg)}}
@keyframes floatHeart{0%{opacity:0;transform:translateY(6px)}20%{opacity:.9}100%{opacity:0;transform:translateY(-40px)}}

@media(max-width:420px){.scene{width:115px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main>
  <article class="letter" aria-live="polite">
    <div class="top">
      <p class="eyebrow" id="eyebrow"></p>
      <div class="scene" id="scene">
        <span class="heart one">♡</span><span class="heart two">♥</span><span class="heart three">♡</span>
        <svg class="hedgehog" viewBox="0 0 300 310" role="img" aria-label="Ёжик с цветочком">
          <ellipse cx="150" cy="292" rx="72" ry="8" fill="#000" opacity=".07"/>
          <g class="hog-body">
            <path id="spikesBack" fill="#7a4e33"/>
            <path id="spikesFront" fill="#a06a45"/>
            <ellipse cx="122" cy="282" rx="20" ry="10" fill="#e8c39c"/>
            <ellipse cx="178" cy="282" rx="20" ry="10" fill="#e8c39c"/>
            <circle cx="103" cy="130" r="15" fill="#f3d9b8"/><circle cx="103" cy="131" r="8" fill="#f6b3b8"/>
            <circle cx="197" cy="130" r="15" fill="#f3d9b8"/><circle cx="197" cy="131" r="8" fill="#f6b3b8"/>
            <ellipse cx="150" cy="198" rx="72" ry="86" fill="#f3d9b8"/>
            <ellipse cx="150" cy="232" rx="44" ry="42" fill="#fae9d4"/>
            <ellipse cx="127" cy="172" rx="8" ry="9.5" fill="#3a2a22"/><ellipse cx="173" cy="172" rx="8" ry="9.5" fill="#3a2a22"/>
            <circle cx="130" cy="168" r="3" fill="#fff"/><circle cx="176" cy="168" r="3" fill="#fff"/>
            <circle cx="125" cy="176" r="1.4" fill="#fff"/><circle cx="171" cy="176" r="1.4" fill="#fff"/>
            <ellipse cx="110" cy="194" rx="11" ry="6.5" fill="#f6a5ad" opacity=".7"/>
            <ellipse cx="190" cy="194" rx="11" ry="6.5" fill="#f6a5ad" opacity=".7"/>
            <ellipse cx="150" cy="188" rx="6" ry="4.5" fill="#3a2a22"/>
            <path d="M142 197 q4 5 8 0 q4 5 8 0" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="114" cy="236" rx="11" ry="19" fill="#e8c39c" transform="rotate(28 114 236)"/>
            <g class="hog-arm">
              <path d="M214 256 C 212 225, 228 200, 224 168" fill="none" stroke="#6bab6a" stroke-width="4" stroke-linecap="round"/>
              <path d="M218 214 c 12 -10 22 -6 24 -2 c -8 8 -16 8 -24 2z" fill="#86c485"/>
              <g transform="translate(224 162)">
                <circle cx="0" cy="-11" r="9" fill="#f7a8c4"/><circle cx="10.5" cy="-3.4" r="9" fill="#f7a8c4"/>
                <circle cx="6.5" cy="9" r="9" fill="#f7a8c4"/><circle cx="-6.5" cy="9" r="9" fill="#f7a8c4"/>
                <circle cx="-10.5" cy="-3.4" r="9" fill="#f7a8c4"/><circle cx="0" cy="0" r="6.5" fill="#ffd36b"/>
              </g>
              <ellipse cx="204" cy="242" rx="11" ry="20" fill="#e8c39c" transform="rotate(-28 204 242)"/>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <h1 id="title"></h1>
    <p class="message" id="message"></p>
    <p class="caption" id="caption"></p>
    <div class="actions"><button class="link" id="next"></button></div>
    <p class="note" id="note"></p>
  </article>
</main>
<script>
function spikes(cx,cy,rIn,rOut,n,offset){
  let d="";
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2+offset,a1=((i+.5)/n)*Math.PI*2+offset,a2=((i+1)/n)*Math.PI*2+offset;
    const p=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r*1.08];
    const [x0,y0]=p(a0,rIn),[x1,y1]=p(a1,rOut),[x2,y2]=p(a2,rIn);
    d+=(i===0?`M${x0} ${y0}`:"")+` Q${x1} ${y1} ${x2} ${y2}`;
  }
  return d+"Z";
}
document.getElementById("spikesBack").setAttribute("d",spikes(150,190,84,112,22,.14));
document.getElementById("spikesFront").setAttribute("d",spikes(150,188,78,100,22,0));

const screens=[
  {label:"маленький сюрпризик для тебя ♡",title:"хеллоу ♡",message:"я знаю, что сейчас у тебя много всего. поэтому твой ежик притопал, чтобы показать, как сильно любит тебя и поднять тебе настроение",button:"открывай →",mood:""},
  {label:"служба доставки нежности",title:"доставка нежности",message:"получатель: самый любимый и единственный",caption:"курьер — ёжик. опыт доставки объятий: огромный. размер курьера: подозрительно маленький)", caption:"",button:"принять доставку ♡",mood:"cheering"},
  {label:"сообщение от ёжика",title:"важное признание",message:"ты моё любимое событие за последние несколько лет",caption:"Угу угу, ёжик сейчас очень серьёзно кивает и смущенно смущается",button:"и ещё кое-что →",mood:""},
  {label:"доставка может задержаться, месяцев на 6…",title:"если бы я была рядышком",message:"то я бы честно просто хотела лежать вместе с тобой, обнимать тебя и целовать в щёчку)",caption:"да, доставка объятий может задержаться из-за расстояния, но я буду так скоро, ты и не заметишь как время пролетит ♡",button:"получить обнимашку ♡",mood:""},
  {label:"доставка завершена",title:"обнимашки доставлены ♡",message:"я очень верю в тебя, и тебе не обязательно справляться со всем идеально, чтобы я тобой гордилась)",caption:"",button:"чмокнуть ёжика ещё раз (надо)",mood:"kissing"}
];
let current=0;
const $=id=>document.getElementById(id);
function animateText(){["title","message","caption"].forEach(id=>{const el=$(id);el.classList.remove("in");void el.offsetWidth;el.classList.add("in");});}
function showScreen(){
  const s=screens[current];
  $("eyebrow").textContent=s.label;$("title").textContent=s.title;
  $("message").textContent=s.message;$("caption").textContent=s.caption;
  $("next").textContent=s.button;$("scene").className="scene "+s.mood;
  $("note").textContent=current===screens.length-1
    ?"от твоего чмони, который очень хочет сейчас быть рядышком с тобой ♡"
    :"сделано с любовью";
  animateText();
}
$("next").addEventListener("click",()=>{
  if(current<screens.length-1){current++;showScreen();}
  else if(current===screens.length-1){
    $("title").textContent="чмок! ♡";
    $("message").textContent="это был виртуальный поцелуй, а настоящий всё ещё ждёт тебя";
    $("caption").textContent="и ещё раз: ты очень любим. независимо от экзаменов, оценок и того, насколько тяжёлым был день";
    $("next").textContent="начать сначала ↻";
    $("scene").className="scene";void $("scene").offsetWidth;$("scene").className="scene kissing";
    $("note").textContent="доставка нежности: повторные отправления разрешены";
    current=screens.length;animateText();
  } else {current=0;showScreen();}
});
showScreen();
</script>
</body>
</html>
